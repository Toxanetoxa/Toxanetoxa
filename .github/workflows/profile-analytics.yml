name: Refresh repository analytics

on:
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-analytics

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Build charts from public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/profile_analytics/refresh.py "$GITHUB_REPOSITORY_OWNER" assets/analytics
      - name: Publish updated charts
        run: |
          if git diff --quiet -- assets/analytics; then
            exit 0
          fi
          git add -- assets/analytics
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh repository analytics charts'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
