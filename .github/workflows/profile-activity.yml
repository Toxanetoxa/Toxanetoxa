name: Refresh profile activity

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Refresh contribution card
        run: python3 scripts/render_activity.py "$GITHUB_REPOSITORY_OWNER" assets/github-activity.svg
      - name: Publish updated card
        run: |
          if git diff --quiet -- assets/github-activity.svg; then
            exit 0
          fi
          git add -- assets/github-activity.svg
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh profile activity'
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
